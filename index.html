<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Красная кнопка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8ecf2; --panel:#f7f9fc; --line:#cfd6e0; --text:#1a1f29; --muted:#5b6575;
  --red:#e5252a; --red-d:#9c1217; --red-l:#ff6a6d; --ok:#1f9d55; color-scheme:light;
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12151b;--panel:#1b1f27;--line:#2c323d;--text:#eef1f6;--muted:#93a0b3;--ok:#3ddc84;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1b1f27;--line:#2c323d;--text:#eef1f6;--muted:#93a0b3;--ok:#3ddc84;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:24px 16px 40px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) 380px;align-items:start;padding-top:40px}}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
h1{font-size:1rem;font-weight:500;color:var(--muted);margin:0}
.banner{min-height:2.3em;font-weight:700;padding:6px 14px;border-radius:999px;font-size:.92rem;border:1px solid transparent;max-width:100%}
.banner.good{border-color:var(--ok);color:var(--ok);background:var(--panel)}
.banner.bad{border-color:var(--red);color:var(--red);background:var(--panel)}
.count{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.rates{color:var(--muted);font-size:.95rem;min-height:1.4em}
.btn-wrap{position:relative;margin:34px 0 28px;width:min(66vw,260px);aspect-ratio:1}
#big{
  all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,var(--red-l),var(--red) 45%,#c21a20 100%);
  box-shadow:0 14px 0 var(--red-d),0 24px 40px rgba(156,18,23,.35),inset 0 -8px 18px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.25);
  transition:transform .06s,box-shadow .06s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;
}
#big:active{transform:translateY(10px);box-shadow:0 4px 0 var(--red-d),0 10px 22px rgba(156,18,23,.35),inset 0 -8px 18px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.25)}
#big:focus-visible{outline:4px solid var(--text);outline-offset:8px}
.pop{position:absolute;pointer-events:none;font-weight:800;font-size:1.5rem;color:var(--red);text-shadow:0 1px 0 var(--bg);animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-190%);opacity:0}}
.mob{all:unset;position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:3.2rem;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mob:focus-visible{outline:3px solid var(--text);border-radius:12px}
.mob small{position:absolute;left:50%;bottom:-.5rem;transform:translateX(-50%);font-size:.85rem;font-weight:800;background:var(--red);color:#fff;border-radius:99px;padding:0 8px}
.mob.hit{animation:shake .2s}
@keyframes shake{25%{transform:translate(-62%,-50%) rotate(-10deg)}75%{transform:translate(-38%,-50%) rotate(10deg)}}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.comet{position:absolute;top:-50px;font-size:2rem;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translate(-220px,110vh)}}
.side{display:grid;gap:16px}
[hidden]{display:none!important}
.tabs{max-width:1000px;margin:0 auto;padding:16px 16px 0;display:flex;gap:8px}
.tab{all:unset;cursor:pointer;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-weight:700;background:var(--panel)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab:focus-visible{outline:3px solid var(--text)}
#achv{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
#achv h2{margin:0 0 4px}#achv p{margin:0 0 14px;color:var(--muted)}
.al{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.a{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.a .ic{grid-row:span 2;font-size:1.8rem}.a b{font-weight:700}.a .d{color:var(--muted);font-size:.88rem}
.a.lock{opacity:.5;filter:grayscale(1)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;display:none;max-width:90vw;text-align:center}
.mob.w .e{display:inline-block;filter:hue-rotate(170deg) saturate(1.7)}
.dog{position:absolute;left:10%;top:100%;transform:translate(-50%,-50%);font-size:2.6rem;line-height:1}
.dog.bite{animation:bite .3s}
@keyframes bite{50%{transform:translate(-30%,-70%) scale(1.25)}}
.wave{position:fixed;bottom:0;left:0;white-space:nowrap;font-size:7rem;line-height:1;animation:sweep 3.2s linear forwards;z-index:6;pointer-events:none}
@keyframes sweep{from{transform:translateX(100vw)}to{transform:translateX(-120%)}}
#anti{background:rgba(10,0,25,.93);color:#e6ccff;flex-direction:column;gap:12px}
.at{font-size:7rem;line-height:1;filter:invert(1) hue-rotate(250deg) drop-shadow(0 0 22px #b04dff);transform:translateX(-70vw);transition:transform 2s ease-in}
.at.go{transform:none}
.at.boom{animation:boom .6s ease-out forwards}
@keyframes boom{to{transform:scale(10);opacity:0}}
.btn.anti{font-size:1.6rem;line-height:1;padding:4px 10px}
.ae{display:inline-block;filter:invert(1) hue-rotate(250deg) drop-shadow(0 0 6px #b04dff)}
.shop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.shop h2{margin:0 0 10px;font-size:1.15rem}
.shop p{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.list{display:grid;gap:8px}
.up{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.up:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.up[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.up:not([aria-disabled="true"]):hover{border-color:var(--red)}
.up .name{font-weight:700}
.up .own{font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.up .desc{color:var(--muted);font-size:.85rem}
.up .cost{font-weight:700;color:var(--red);text-align:right;font-size:.95rem;font-variant-numeric:tabular-nums}
.up[aria-disabled="true"] .cost{color:var(--muted)}
.foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;gap:8px}
.btn{all:unset;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.btn:focus-visible{outline:3px solid var(--text)}
.btn.main{background:var(--red);color:#fff;border-color:var(--red)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:20;padding:20px;text-align:center}
.ov.show{display:flex}
.card{background:var(--panel);color:var(--text);padding:28px;border-radius:16px;max-width:340px;display:grid;gap:14px;justify-items:center}
.card h2{margin:0;font-size:1.6rem}.card p{margin:0;color:var(--muted)}
#god{background:radial-gradient(circle,#6b4700,#0d0900);color:#ffe9a3;overflow:hidden}
.rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,217,77,.22) 0 9deg,transparent 9deg 18deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gw{position:relative;display:grid;gap:6px;justify-items:center}
.crown{font-size:3rem;animation:drop 1.2s ease-out both}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
.gb{font-size:8rem;line-height:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#gt{font-size:1.3rem;font-weight:700;margin:0}
@media(prefers-reduced-motion:reduce){.pop,.comet,.rays,.crown,.gb,.mob.hit,.dog.bite{animation:none}.wave{display:none}.at{transition:none}.comet{display:none}#big{transition:none}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="toast" role="status"></div>
<nav class="tabs" role="tablist"><button class="tab" role="tab" id="tg" aria-selected="true">Игра</button><button class="tab" role="tab" id="ta" aria-selected="false">Ачивки <span id="ac"></span></button></nav>
<main>
  <section class="stage" aria-label="Кнопка">
    <h1>Нажимай на кнопку</h1>
    <div class="banner" id="bn" aria-live="polite"></div>
    <div class="count" id="count">0</div>
    <div class="rates" id="rates"></div>
    <div class="btn-wrap" id="wrap"><button id="big" aria-label="Красная кнопка. Нажми, чтобы получить очки"></button></div>
  </section>
  <aside class="side">
    <section class="shop" aria-label="Магазин улучшений">
      <h2>Магазин улучшений</h2>
      <div class="list" id="list"></div>
      <div class="foot"><span id="total">Всего кликов: 0</span><button class="btn anti" id="reset" type="button" title="Сбросить всё" aria-label="Антиматерийный индюк: сбросить всё"><span class="ae">🦃</span></button></div>
    </section>
    <section class="shop" aria-label="Перерождение">
      <h2>Перерождение</h2>
      <p>Сбросит очки и улучшения. Ты получишь 1 перерождение, а оно открывает магазин перерождений.</p>
      <button class="btn main" id="rbBtn" type="button">Переродиться за 500 тыс.</button>
    </section>
    <section class="shop" id="rbShop" aria-label="Магазин перерождений" hidden>
      <h2>Магазин перерождений</h2>
      <p id="rbCount"></p>
      <div class="list" id="rbList"></div>
    </section>
  </aside>
</main>
<section id="achv" hidden aria-label="Ачивки"><h2>Ачивки</h2><p id="ap"></p><div class="al" id="al"></div></section>
<div class="ov" id="over" role="dialog" aria-modal="true" aria-label="Игра окончена">
  <div class="card"><h2>Игра окончена</h2><p>Индюки украли все твои клики.</p><button class="btn main" id="again" type="button">Начать заново</button></div>
</div>
<div class="ov" id="god" aria-live="polite">
  <div class="rays"></div>
  <div class="gw"><div class="crown">👑</div><div class="gb">🦃</div><p id="gt"></p></div>
</div>
<div class="ov" id="anti" aria-live="polite"><div class="at" id="at">🦃</div><p id="atp" style="margin:0;font-size:1.3rem;font-weight:700"></p></div>
<script>
(function(){
  var KEY="red-button-clicker-v1",RB_COST=500000;
  var U=[
    {id:"finger",name:"Крепкий палец",desc:"+1 за клик",t:"click",v:1,b:15,g:1.15},
    {id:"intern",name:"Стажёр",desc:"+1 очко в секунду",t:"auto",v:1,b:50,g:1.15},
    {id:"mouse",name:"Игровая мышь",desc:"+5 за клик",t:"click",v:5,b:150,g:1.15},
    {id:"auto",name:"Автокликер",desc:"+5 очков в секунду",t:"auto",v:5,b:300,g:1.15},
    {id:"double",name:"Двойной клик",desc:"+10 за клик",t:"click",v:10,b:1200,g:1.16},
    {id:"farm",name:"Кликерная ферма",desc:"+30 очков в секунду",t:"auto",v:30,b:2500,g:1.15},
    {id:"robot",name:"Робот-кликер",desc:"+100 очков в секунду",t:"auto",v:100,b:10000,g:1.15},
    {id:"gold",name:"Золотая кнопка",desc:"+25% ко всему доходу",t:"mult",v:.25,b:20000,g:2.2},
    {id:"quant",name:"Квантовый палец",desc:"+100 за клик",t:"click",v:100,b:50000,g:1.17},
    {id:"factory",name:"Кликерная фабрика",desc:"+500 очков в секунду",t:"auto",v:500,b:100000,g:1.15}
  ];
  var S={n:0,total:0,own:{},rb:0,ever:false,sword:false,dog:0,ach:{}};
  U.forEach(function(u){S.own[u.id]=0});
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);S.n=+d.n||0;S.total=+d.total||0;S.rb=+d.rb||0;S.ever=!!d.ever;S.sword=!!d.sword;S.dog=+d.dog||0;S.ach=d.ach||{};
      U.forEach(function(u){S.own[u.id]=(d.own&&+d.own[u.id])||0})}
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  function $(i){return document.getElementById(i)}
  var AC=[
    {id:"first",n:"Первые шаги",d:"Кликни 1 раз на кнопку"},
    {id:"anti",n:"Это было к удивлению не больно",d:"Используй антиматерийного индюка"},
    {id:"water",n:"Водный прилив сил",d:"Используй водного индюка"},
    {id:"hunt",n:"Истребитель индюшар",d:"Уничтожь всех индюков"},
    {id:"sap",n:"Сапёр",d:"Обезвредь бомбу"},
    {id:"life",n:"Новая жизнь",d:"Переродись"},
    {id:"bite",n:"Меня загрызли",d:"Поймай окно «Игра окончена»"},
    {id:"dbl",n:"Двойная проблема",d:"Выживи, когда одновременно напали индюки и есть бомба"},
    {id:"guard",n:"Лучшая охрана",d:"Купи собаку и улучши её"},
    {id:"sw",n:"Звёздные войны",d:"Купи меч"},
    {id:"all",n:"Почётный игрок",d:"Выполни все ачивки"}
  ];
  var tT;
  function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tT);tT=setTimeout(function(){e.style.display="none"},3500)}
  function ach(id){
    if(S.ach[id])return;
    S.ach[id]=true;
    var a=AC.filter(function(x){return x.id===id})[0];
    toast("🏆 Ачивка: "+a.n);
    if(id!=="all"&&AC.every(function(x){return x.id==="all"||S.ach[x.id]}))ach("all");
    save();drawAch();
  }
  function drawAch(){
    var h="",c=0;
    AC.forEach(function(a){var ok=S.ach[a.id];if(ok)c++;h+='<div class="a'+(ok?"":" lock")+'"><div class="ic">'+(ok?"🏆":"🔒")+'</div><b>'+a.n+'</b><span class="d">'+a.d+'</span></div>'});
    $("al").innerHTML=h;$("ap").textContent="Получено: "+c+" из "+AC.length;$("ac").textContent="("+c+"/"+AC.length+")";
  }
  function fmt(n){
    if(n<1000)return String(Math.floor(n));
    var s=[" тыс."," млн"," млрд"," трлн"," квадр."],i=-1;
    while(n>=1000&&i<s.length-1){n/=1000;i++}
    return (Math.floor(n*100)/100).toLocaleString("ru-RU")+s[i];
  }
  var G,busy=false,P=[[12,6],[88,6],[0,55],[100,55],[50,100]];
  function allM(){return G.t.concat(G.bomb?[G.bomb]:[],G.wm?[G.wm]:[])}
  function resetG(){
    if(G)allM().forEach(function(m){m.el.remove()});
    G={imm:Date.now()+30000,t:[],bomb:null,fuse:0,rain:false,rainEnd:0,lastEnd:0,ev:0,st:0,bi:40+Math.random()*50,cm:0,over:false,msg:"",msgEnd:0,wm:null,wi:180,wx:0,dc:5,dbl:false};
  }
  resetG();
  function mult(){var m=1;U.forEach(function(u){if(u.t==="mult")m+=u.v*S.own[u.id]});return m*(G.rain?2:1)}
  function perClick(){var c=1;U.forEach(function(u){if(u.t==="click")c+=u.v*S.own[u.id]});return c*mult()}
  function perSec(){var a=0;U.forEach(function(u){if(u.t==="auto")a+=u.v*S.own[u.id]});return a*mult()}
  function cost(u){return Math.ceil(u.b*Math.pow(u.g,S.own[u.id]))}

  var $w=$("wrap"),els={};
  var dogEl=document.createElement("span");dogEl.className="dog";dogEl.textContent="🐕";dogEl.hidden=true;$w.appendChild(dogEl);
  U.forEach(function(u){
    var b=document.createElement("button");
    b.type="button";b.className="up";
    b.innerHTML='<span class="name"></span><span class="own"></span><span class="desc"></span><span class="cost"></span>';
    b.querySelector(".name").textContent=u.name;
    b.querySelector(".desc").textContent=u.desc;
    b.addEventListener("click",function(){
      var c=cost(u);if(S.n<c||G.over||busy)return;
      S.n-=c;S.own[u.id]++;save();render();
    });
    $("list").appendChild(b);els[u.id]=b;
  });
  var sw=document.createElement("button");
  sw.type="button";sw.className="up";
  sw.innerHTML='<span class="name">Меч</span><span class="own"></span><span class="desc">Индюки гибнут с 4 ударов вместо 7, бомбы с 5 вместо 8</span><span class="cost"></span>';
  sw.addEventListener("click",function(){if(S.sword||S.rb<1)return;S.rb--;S.sword=true;save();ach("sw");render()});
  $("rbList").appendChild(sw);
  var dg=document.createElement("button");
  dg.type="button";dg.className="up";
  dg.innerHTML='<span class="name"></span><span class="own"></span><span class="desc"></span><span class="cost"></span>';
  function dogCost(){return S.dog===0?5:3}
  dg.addEventListener("click",function(){var c=dogCost();if(S.dog>=2||S.rb<c)return;S.rb-=c;S.dog++;save();if(S.dog===2)ach("guard");render()});
  $("rbList").appendChild(dg);

  function render(){
    $("count").textContent=fmt(S.n);
    $("rates").textContent="+"+fmt(perClick())+" за клик · +"+fmt(perSec())+" в секунду";
    $("total").textContent="Всего кликов: "+S.total.toLocaleString("ru-RU");
    U.forEach(function(u){
      var b=els[u.id],c=cost(u);
      b.setAttribute("aria-disabled",S.n<c?"true":"false");
      b.querySelector(".own").textContent="×"+S.own[u.id];
      b.querySelector(".cost").textContent=fmt(c);
    });
    $("rbBtn").setAttribute("aria-disabled",S.n<RB_COST?"true":"false");
    $("rbBtn").style.opacity=S.n<RB_COST?".5":"1";
    $("rbShop").hidden=!S.ever;
    $("rbCount").textContent="Твои перерождения: "+S.rb;
    sw.setAttribute("aria-disabled",(S.sword||S.rb<1)?"true":"false");
    sw.querySelector(".own").textContent=S.sword?"Куплено":"";
    sw.querySelector(".cost").textContent=S.sword?"":"1 перерождение";
    var dc=dogCost(),mx=S.dog>=2;
    dg.setAttribute("aria-disabled",(mx||S.rb<dc)?"true":"false");
    dg.querySelector(".name").textContent=S.dog===0?"Собака":S.dog===1?"Улучшение собаки":"Собака улучшена";
    dg.querySelector(".desc").textContent=S.dog===0?"Раз в 5 с кусает индюка и бомбу":S.dog===1?"Кулдаун 3 с вместо 5":"Кусает раз в 3 секунды";
    dg.querySelector(".own").textContent=mx?"Максимум":"";
    dg.querySelector(".cost").textContent=mx?"":dc+" перерожд.";
    dogEl.hidden=!S.dog;
  }
  function banner(){
    var p=[],bad=false,now=Date.now();
    if(now<G.imm)p.push("🛡 Бессмертие: "+Math.ceil((G.imm-now)/1000)+" с");
    if(G.t.length){p.push("🦃 Индюки атакуют! Осталось: "+G.t.length);bad=true}
    if(G.rain)p.push("☄️ Дождь комет ×2: "+Math.max(0,Math.ceil((G.rainEnd-now)/1000))+" с");
    if(G.bomb){p.push("💣 Бомба взорвётся через "+Math.max(0,Math.ceil(G.fuse))+" с");bad=true}
    if(G.wm)p.push("🌊 Водный индюк пришёл! Нажми на него ("+Math.max(0,Math.ceil(G.wx))+" с)");
    if(G.msgEnd>now)p.push(G.msg);
    $("bn").textContent=p.join(" · ");
    $("bn").className="banner"+(p.length?(bad?" bad":" good"):"");
  }
  function flash(t){G.msg=t;G.msgEnd=Date.now()+4000}

  function mob(type,x,y,need){
    var b=document.createElement("button");
    b.type="button";b.className="mob"+(type==="w"?" w":"");
    b.style.left=x+"%";b.style.top=y+"%";
    b.setAttribute("aria-label",type==="t"?"Индюк":type==="b"?"Бомба":"Водный индюк");
    b.innerHTML='<span class="e">'+(type==="b"?"💣":"🦃")+"</span><small>"+need+"</small>";
    $w.appendChild(b);
    var m={el:b,hp:need};
    b.addEventListener("click",function(){hit(m,type)});
    return m;
  }
  function water(){
    G.wm=null;G.wi=180;
    var g=Math.max(50,Math.floor(S.n*(.3+Math.random()*.2)));
    S.n+=g;flash("🌊 Водный индюк подарил +"+fmt(g));ach("water");
  }
  function hit(m,type){
    if(G.over||busy)return;
    m.hp--;
    m.el.querySelector("small").textContent=m.hp;
    m.el.classList.remove("hit");void m.el.offsetWidth;m.el.classList.add("hit");
    if(m.hp<=0){
      m.el.remove();
      if(type==="t"){G.t=G.t.filter(function(x){return x!==m});if(!G.t.length){G.lastEnd=Date.now();flash("Все индюки уничтожены!");ach("hunt")}}
      else if(type==="b"){G.bomb=null;G.bi=40+Math.random()*50;flash("Бомба обезврежена!");ach("sap")}
      else{water()}
    }
    banner();
  }
  function tsunami(){
    var w=document.createElement("div");w.className="wave";w.textContent="🌊🌊🌊🌊🌊🌊🌊🌊";
    $("sky").appendChild(w);setTimeout(function(){w.remove()},3300);
  }
  function comet(){
    var c=document.createElement("span");
    c.className="comet";c.textContent="☄️";c.style.left=(Math.random()*110)+"vw";
    $("sky").appendChild(c);setTimeout(function(){c.remove()},1900);
  }
  function gameOver(){
    G.over=true;
    G.t.concat(G.bomb?[G.bomb]:[]).forEach(function(m){m.el.remove()});
    G.t=[];G.bomb=null;if(G.wm){G.wm.el.remove();G.wm=null}ach("bite");$("over").classList.add("show");
  }
  $("again").addEventListener("click",function(){
    S.n=0;S.total=0;U.forEach(function(u){S.own[u.id]=0});save();
    $("over").classList.remove("show");resetG();render();
  });

  $("big").addEventListener("click",function(e){
    if(G.over||busy)return;
    var p=perClick();S.n+=p;S.total++;ach("first");
    var r=$w.getBoundingClientRect(),x,y;
    if(e.clientX){x=e.clientX-r.left;y=e.clientY-r.top}else{x=r.width/2;y=r.height/2}
    var s=document.createElement("span");
    s.className="pop";s.textContent="+"+fmt(p);
    s.style.left=x+"px";s.style.top=y+"px";
    $w.appendChild(s);setTimeout(function(){s.remove()},800);
    render();
  });

  $("rbBtn").addEventListener("click",function(){
    if(S.n<RB_COST||G.over||busy)return;
    busy=true;
    G.t.concat(G.bomb?[G.bomb]:[]).forEach(function(m){m.el.remove()});
    G.t=[];G.bomb=null;
    if(G.wm){G.wm.el.remove();G.wm=null}
    $("god").classList.add("show");
    $("gt").textContent="Бог индюков услышал тебя…";
    setTimeout(function(){$("gt").textContent="Он дарует тебе перерождение!"},2200);
    setTimeout(function(){
      S.n=0;S.total=0;U.forEach(function(u){S.own[u.id]=0});
      S.rb++;S.ever=true;save();resetG();ach("life");
      $("god").classList.remove("show");busy=false;render();
    },4800);
  });
  $("reset").addEventListener("click",function(){
    if(busy||G.over||!confirm("Антиматерийный индюк сотрёт весь прогресс: очки, улучшения, перерождения, меч и собаку. Ачивки останутся. Продолжить?"))return;
    busy=true;allM().forEach(function(m){m.el.remove()});G.t=[];G.bomb=null;G.wm=null;
    var o=$("anti"),a=$("at");
    a.className="at";$("atp").textContent="К тебе приближается антиматерийный индюк…";o.classList.add("show");
    setTimeout(function(){a.classList.add("go")},50);
    setTimeout(function(){a.classList.add("boom");$("atp").textContent="БАБАХ!"},2300);
    setTimeout(function(){
      S.n=0;S.total=0;S.rb=0;S.ever=false;S.sword=false;S.dog=0;U.forEach(function(u){S.own[u.id]=0});
      save();resetG();o.classList.remove("show");busy=false;ach("anti");render();
    },3200);
  });

  var last=Date.now();
  setInterval(function(){
    var now=Date.now(),dt=Math.min((now-last)/1000,1);last=now;
    if(busy||G.over||paused)return;
    S.n+=perSec()*dt;
    G.ev+=dt;
    var act=G.t.length||G.rain;
    if(G.rain&&now>=G.rainEnd){G.rain=false;G.lastEnd=now}
    if(now>G.imm){
      if(G.ev>=60&&!act&&now-G.lastEnd>=30000){
        G.ev=0;
        if(Math.random()<.5){P.forEach(function(p){G.t.push(mob("t",p[0],p[1],S.sword?4:7))});G.st=0}
        else{G.rain=true;G.rainEnd=now+30000}
      }
      if(G.t.length){
        G.st+=dt;
        if(G.st>=2){G.st-=2;S.n=Math.max(0,S.n-G.t.length*Math.max(3,S.n*.02));if(S.n<=0){gameOver();render();return}}
      }
      if(G.bomb){
        G.fuse-=dt;
        if(G.fuse<=0){var l=Math.min(100,S.n);S.n-=l;G.bomb.el.remove();G.bomb=null;G.bi=40+Math.random()*50;flash("💥 Бомба взорвалась: −"+Math.floor(l))}
      }else{
        G.bi-=dt;
        if(G.bi<=0)(function(){G.bomb=mob("b",25+Math.random()*50,25+Math.random()*50,S.sword?5:8);G.fuse=10})();
      }
    }
    if(G.rain){G.cm+=dt;if(G.cm>.25){G.cm=0;comet()}}
    if(G.wm){G.wx-=dt;if(G.wx<=0){G.wm.el.remove();G.wm=null;G.wi=180;flash("Водный индюк ушёл")}}
    else{G.wi-=dt;if(G.wi<=0){tsunami();G.wm=mob("w",50,-16,1);G.wx=20}}
    if(S.dog){
      var cd=S.dog>1?3:5;
      if(G.t.length||G.bomb){G.dc+=dt;if(G.dc>=cd){G.dc=0;dogEl.classList.remove("bite");void dogEl.offsetWidth;dogEl.classList.add("bite");if(G.t.length)hit(G.t[0],"t");if(G.bomb)hit(G.bomb,"b")}}
      else G.dc=cd;
    }
    if(G.t.length&&G.bomb)G.dbl=true;
    if(G.dbl&&!G.t.length&&!G.bomb){G.dbl=false;ach("dbl")}
    render();banner();
  },100);
  setInterval(save,5000);
  var paused=false;
  function tab(a){paused=a;$("tg").setAttribute("aria-selected",String(!a));$("ta").setAttribute("aria-selected",String(a));document.querySelector("main").hidden=a;$("achv").hidden=!a}
  $("tg").addEventListener("click",function(){tab(false)});
  $("ta").addEventListener("click",function(){tab(true)});
  drawAch();
  window.addEventListener("pagehide",save);
  render();banner();
})();
</script>
</body>
</html>
